<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulasi Tata Surya Interaktif - Mode Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --space-bg: #0b0d17;
            --orbit-color: rgba(255, 255, 255, 0.15);
            --sun-glow: rgba(255, 204, 0, 0.6);
        }

        body, html {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background-color: var(--space-bg); color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
            -webkit-user-select: none;
        }

        /* Latar Belakang Bintang */
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.8; animation: twinkle var(--duration) infinite alternate;
            pointer-events: none;
        }
        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Area Game Utama & Layar Transisi */
        .screen-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            transition: opacity 0.4s ease, visibility 0.4s ease;
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .screen-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

        /* Splash Screen */
        #splash-screen { z-index: 999; flex-direction: column; background: var(--space-bg); }
        .splash-logo { width: 120px; height: 120px; position: relative; margin-bottom: 2rem; animation: pulse-glow 2s infinite alternate; }
        .splash-sun { width: 40px; height: 40px; background: radial-gradient(circle, #ffd700, #ff8c00); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 30px rgba(255, 140, 0, 0.8); }
        .splash-orbit { width: 100%; height: 100%; border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 50%; position: absolute; top: 0; left: 0; animation: spin 3s linear infinite; }
        .splash-planet { width: 16px; height: 16px; background: #4ade80; border-radius: 50%; position: absolute; top: -8px; left: 52px; box-shadow: 0 0 15px #4ade80; }
        .splash-loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #a855f7); animation: splash-load 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        @keyframes splash-load { 0% { width: 0%; } 100% { width: 100%; } }

        /* Mode Selection & Home UI */
        .mode-btn { transition: all 0.3s; border: 2px solid transparent; }
        .mode-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); transform: scale(1.05); }
        .player-form { transition: all 0.3s ease; max-height: 0; opacity: 0; overflow: hidden; }
        .player-form.active { max-height: 250px; opacity: 1; margin-bottom: 1rem; overflow: visible;}
        .login-bg-glow { background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.2), transparent 70%); }

        /* Game Wrapper (Grid System untuk Split Screen) */
        #game-wrapper {
            position: absolute; inset: 0; display: flex;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            flex-direction: row; /* Default Landscape Split */
        }
        #game-wrapper.active { opacity: 1; pointer-events: auto; }
        
        @media (max-width: 768px) and (orientation: portrait) {
            #game-wrapper.duel-mode { flex-direction: column; } /* Vertical Split di HP */
        }

        /* Game Instance (Individual Player Area) */
        .game-instance {
            flex: 1; position: relative; display: flex; overflow: hidden;
            border-right: 2px solid rgba(255,255,255,0.1);
        }
        .duel-mode .game-instance:last-child { border-right: none; }
        @media (max-width: 768px) and (orientation: portrait) {
            .duel-mode .game-instance { border-right: none; border-bottom: 2px solid rgba(255,255,255,0.1); }
            .duel-mode .game-instance:last-child { border-bottom: none; }
        }

        /* Area Dalam Instance */
        .orbit-zone { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .planet-sidebar {
            width: 100px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px);
            border-left: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column;
            justify-content: space-evenly; align-items: center; padding: 10px; z-index: 10;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .game-instance { flex-direction: column; }
            .orbit-zone { order: 1; height: 80%; width: 100%; }
            .planet-sidebar {
                order: 2; width: 100%; height: 20%; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.2);
                flex-direction: row; padding: 5px; gap: 5px;
            }
            .planet-sidebar .planet { transform: scale(0.8); margin: 0 -5px; }
        }

        /* Matahari & Orbit */
        .sun {
            width: 70px; height: 70px; border-radius: 50%; position: absolute; z-index: 2;
            background: radial-gradient(circle at 30% 30%, #fff7e6 0%, #ffd700 20%, #ff8c00 60%, #ff4500 100%);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.8), 0 0 60px rgba(255, 204, 0, 0.4), inset 0 0 20px rgba(255, 69, 0, 0.5);
            animation: sun-pulse 4s infinite ease-in-out;
        }
        .duel-mode .sun { width: 45px; height: 45px; }
        @media (max-width: 768px) { .duel-mode .sun { width: 40px; height: 40px; } }

        .orbit-ring {
            position: absolute; border: 1px dashed var(--orbit-color); border-radius: 50%;
            pointer-events: none; transition: border-color 0.3s;
        }
        .orbit-ring.highlight { border-color: rgba(100, 255, 100, 0.7); border-width: 2px; box-shadow: 0 0 15px rgba(100, 255, 100, 0.2); }

        /* Planet */
        .planet {
            border-radius: 50%; cursor: grab; position: relative; z-index: 20;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.7), 2px 2px 5px rgba(0,0,0,0.3);
            background-size: cover; background-position: center; transition: transform 0.2s;
        }
        .planet:active { cursor: grabbing; transform: scale(1.1); }
        .planet-label { position: absolute; bottom: -18px; font-size: 10px; white-space: nowrap; text-shadow: 0 2px 4px black; font-weight: 600; pointer-events: none; }
        .planet.placed .planet-label { opacity: 0; }
        
        /* Cincin Saturnus/Uranus */
        .ringed::after {
            content: ''; position: absolute; width: 180%; height: 180%; border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 45%, rgba(210, 190, 150, 0.6) 46%, rgba(180, 160, 120, 0.3) 50%, rgba(210, 190, 150, 0.6) 55%, rgba(0,0,0,0) 65%);
            top: -40%; left: -40%; transform: rotateX(75deg); pointer-events: none;
        }
        .planet[data-id="uranus"].ringed::after { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 45%, rgba(175, 238, 238, 0.5) 50%, rgba(0,0,0,0) 65%); transform: rotateY(75deg); }

        /* Animasi Orbit */
        @keyframes orbit-animation { from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); } to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); } }
        .orbiting-wrapper { position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: 5; animation: orbit-animation linear infinite; }

        /* Player UI per Instance */
        .instance-ui {
            position: absolute; top: 10px; left: 10px; z-index: 40; pointer-events: none;
            display: flex; flex-direction: column; gap: 5px;
        }
        .player-badge {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #bae6fd;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .player-badge .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; animation: pulse 2s infinite; }
        
        .progress-container { width: 150px; }
        .progress-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #a855f7); transition: width 0.3s; }
        @media (max-width: 768px) { .progress-container { width: 100px; } }

        /* Global Controls */
        #global-controls { position: fixed; top: 10px; right: 10px; z-index: 200; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #global-controls.active { opacity: 1; pointer-events: auto; }
        .icon-btn {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
            color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        /* Feedback Modal */
        #feedback-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #3b82f6; padding: 30px; border-radius: 20px;
            text-align: center; display: none; z-index: 1000; width: 85%; max-width: 450px;
            backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
        }

        .slot-correct { animation: correct-pulse 0.5s ease-out; }
        @keyframes correct-pulse { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.3); filter: brightness(1.5); } 100% { transform: scale(1); filter: brightness(1); } }
        .input-error { animation: shake 0.4s ease-in-out; border-color: #ef4444 !important; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* Custom Scrollbar untuk Leaderboard */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }

        /* Papan Skor Podium */
        .podium-container {
            display: flex; align-items: flex-end; justify-content: center; gap: 10px;
            margin-bottom: 20px; height: 180px; padding-top: 20px;
        }
        .podium { display: flex; flex-direction: column; align-items: center; width: 30%; position: relative; }
        .podium .avatar { font-size: 35px; margin-bottom: -5px; z-index: 2; text-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .podium .name { font-weight: bold; color: white; text-align: center; font-size: 13px; text-shadow: 1px 1px 0 #000; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .podium .school { font-size: 10px; color: #bae6fd; text-align: center; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
        .podium .score { font-size: 18px; color: #fbd000; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
        .step { width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; font-size: 24px; font-weight: bold; color: rgba(255,255,255,0.9); border-radius: 10px 10px 0 0; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.6); }
        .step-1 { height: 100px; background: linear-gradient(to bottom, #FFD700, #DAA520); }
        .step-2 { height: 75px; background: linear-gradient(to bottom, #E0E0E0, #9E9E9E); }
        .step-3 { height: 50px; background: linear-gradient(to bottom, #CD7F32, #8B4513); }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="screen-overlay active">
        <div class="splash-logo">
            <div class="splash-orbit"><div class="splash-planet"></div></div>
            <div class="splash-sun"></div>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 tracking-widest animate-pulse mb-6">
            MEMUAT ALAM SEMESTA...
        </h1>
        <div class="w-64 h-1.5 bg-white/10 rounded-full overflow-hidden shadow-inner"><div class="splash-loading-bar"></div></div>
    </div>

    <!-- GLOBAL CONTROLS -->
    <div id="global-controls">
        <button class="icon-btn" onclick="goToHome(true)" title="Menu Utama">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z"/><path d="m8 3.293 6 6V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V9.293l6-6Z"/></svg>
        </button>
        <button class="icon-btn" onclick="resetCurrentGame()" title="Ulangi Misi">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleSound()" title="Suara">
            <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-.708.707A7.476 7.476 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303l.708.707z"/><path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.483 5.483 0 0 1 11.025 8a5.483 5.483 0 0 1-1.61 3.89l.706.706z"/><path d="M8.707 11.182A4.486 4.486 0 0 0 10.025 8a4.486 4.486 0 0 0-1.318-3.182L8 5.525A3.489 3.489 0 0 1 9.025 8 3.49 3.49 0 0 1 8 10.475l.707.707zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/></svg>
            <svg id="icon-sound-off" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06zm7.138 2.096a.5.5 0 0 1 0 .708L11.707 8l2.147 2.146a.5.5 0 0 1-.708.708L11 8.707l-2.146 2.147a.5.5 0 0 1-.708-.708L10.293 8 8.146 5.854a.5.5 0 1 1 .708-.708L11 7.293l2.146-2.147a.5.5 0 0 1 .708 0z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleFullscreen()" title="Layar Penuh">
            <svg id="icon-fs-enter" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zM15.5 10a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 14.5 16h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/></svg>
            <svg id="icon-fs-exit" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5zM0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zm10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4z"/></svg>
        </button>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen-overlay">
        <div class="bg-gray-900/80 border border-blue-500/50 p-6 md:p-8 rounded-2xl shadow-2xl text-center max-w-md w-full mx-4 relative overflow-hidden ring-1 ring-white/10 login-bg-glow">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 drop-shadow-md">Misi Tata Surya</h1>
            <p class="text-blue-200/80 text-sm mb-6">Susun planet pada orbitnya secepat mungkin!</p>

            <!-- Mode Selector -->
            <div class="flex gap-2 mb-6">
                <button onclick="setMode('solo')" id="btn-mode-solo" class="mode-btn active flex-1 bg-gray-800 text-white py-2 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <span>👤</span> Solo
                </button>
                <button onclick="setMode('duel')" id="btn-mode-duel" class="mode-btn flex-1 bg-gray-800 text-white py-2 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <span>👥</span> Duel
                </button>
            </div>
            
            <!-- Forms -->
            <div id="form-p1" class="player-form active">
                <div class="text-left text-xs text-blue-300 mb-1 ml-1 font-bold">PEMAIN 1</div>
                <input type="text" id="p1-name" placeholder="Nama..." class="w-full bg-gray-900/80 border border-gray-600 text-white px-4 py-2.5 rounded-lg mb-2 focus:border-blue-400 focus:ring-1 focus:ring-blue-500 outline-none transition-all text-sm" autocomplete="off" maxlength="15">
                <input type="text" id="p1-school" placeholder="Sekolah..." class="w-full bg-gray-900/80 border border-gray-600 text-white px-4 py-2.5 rounded-lg mb-2 focus:border-blue-400 focus:ring-1 focus:ring-blue-500 outline-none transition-all text-sm" autocomplete="off" maxlength="30">
            </div>

            <div id="form-p2" class="player-form">
                <div class="text-left text-xs text-purple-300 mb-1 ml-1 font-bold">PEMAIN 2</div>
                <input type="text" id="p2-name" placeholder="Nama..." class="w-full bg-gray-900/80 border border-purple-600/50 text-white px-4 py-2.5 rounded-lg mb-2 focus:border-purple-400 focus:ring-1 focus:ring-purple-500 outline-none transition-all text-sm" autocomplete="off" maxlength="15">
                <input type="text" id="p2-school" placeholder="Sekolah..." class="w-full bg-gray-900/80 border border-purple-600/50 text-white px-4 py-2.5 rounded-lg mb-2 focus:border-purple-400 focus:ring-1 focus:ring-purple-500 outline-none transition-all text-sm" autocomplete="off" maxlength="30">
            </div>
            
            <div class="space-y-3 relative z-10 mt-2">
                <button onclick="startGameSession()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transform transition hover:scale-[1.02] active:scale-95">
                    Mulai Ekspedisi
                </button>
                <button onclick="showLeaderboard()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform transition hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                    🏆 Papan Skor
                </button>
            </div>

            <!-- Identitas dan Sosial Media -->
            <div class="mt-8 flex flex-col items-center gap-3 relative z-10">
                <p class="text-sm text-blue-200/80 font-semibold tracking-wide">Karya : Noviyalpg</p>

    <script>
        // --- DATA & CONFIG ---
        const planetData = [
            { id: 'mercury', name: 'Merkurius', type: 'mercury', size: 24, orbitIndex: 0, orbitTime: 5 },
            { id: 'venus', name: 'Venus', type: 'venus', size: 32, orbitIndex: 1, orbitTime: 8 },
            { id: 'earth', name: 'Bumi', type: 'earth', size: 34, orbitIndex: 2, orbitTime: 12 },
            { id: 'mars', name: 'Mars', type: 'mars', size: 28, orbitIndex: 3, orbitTime: 15 },
            { id: 'jupiter', name: 'Jupiter', type: 'jupiter', size: 60, orbitIndex: 4, orbitTime: 25 },
            { id: 'saturn', name: 'Saturnus', type: 'saturn', size: 52, orbitIndex: 5, isRinged: true, orbitTime: 35 },
            { id: 'uranus', name: 'Uranus', type: 'uranus', size: 42, orbitIndex: 6, isRinged: true, orbitTime: 45 },
            { id: 'neptune', name: 'Neptunus', type: 'neptune', size: 40, orbitIndex: 7, orbitTime: 55 }
        ];
        const TOTAL_PLANETS = planetData.length;
        
        // Link Backend GAS Papan Skor
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyKjFmv5qA05EWcd5e6E0cZIosi-prqOleabf6X9sLeW5pZcqfKJprcBJwDa4okjTl-/exec";

        // --- GLOBAL STATE ---
        let currentMode = 'solo'; // 'solo' or 'duel'
        let instances = [];
        let isGameActive = false;
        let activeDrag = { element: null, sourceInstanceId: null, offsetX: 0, offsetY: 0 };
        
        // --- AUDIO ENGINE ---
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSound() {
            isMuted = !isMuted;
            document.getElementById('icon-sound-on').classList.toggle('hidden');
            document.getElementById('icon-sound-off').classList.toggle('hidden');
            if (!isMuted) initAudio();
        }

        function playTone(freq, type, duration, startTime = 0, vol = 0.1) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime + startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime); osc.stop(audioCtx.currentTime + startTime + duration);
        }

        function playSound(type) {
            if (isMuted || !audioCtx) return;
            switch (type) {
                case 'grab': playTone(400, 'sine', 0.1, 0, 0.05); break;
                case 'success': playTone(523.25, 'sine', 0.2, 0, 0.1); playTone(659.25, 'sine', 0.3, 0.1, 0.1); break;
                case 'error': playTone(150, 'sawtooth', 0.2, 0, 0.05); break;
                case 'win': playTone(523.25, 'triangle', 0.4, 0, 0.1); playTone(659.25, 'triangle', 0.4, 0.15, 0.1); playTone(1046.50, 'triangle', 0.8, 0.45, 0.1); break;
            }
        }

        // --- UI & SCREEN MANAGEMENT ---
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-solo').classList.toggle('active', mode === 'solo');
            document.getElementById('btn-mode-duel').classList.toggle('active', mode === 'duel');
            document.getElementById('form-p2').classList.toggle('active', mode === 'duel');
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen-overlay').forEach(el => el.classList.remove('active'));
            document.getElementById('feedback-modal').style.display = 'none';
            document.getElementById('game-wrapper').classList.remove('active');
            document.getElementById('global-controls').classList.remove('active');

            if (screenId === 'game') {
                document.getElementById('game-wrapper').classList.add('active');
                document.getElementById('global-controls').classList.add('active');
            } else {
                const screen = document.getElementById(screenId + '-screen');
                if (screen) screen.classList.add('active');
            }
        }

        // --- LEADERBOARD & DATABASE LOGIC ---
        async function fetchLeaderboard() {
            const lbLoading = document.getElementById('lb-loading');
            const lbContent = document.getElementById('lb-content');
            lbLoading.style.display = 'block';
            lbContent.classList.add('hidden');
            lbContent.innerHTML = '';

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    lbContent.innerHTML = '<div class="text-center text-gray-400 py-4">Belum ada penjelajah yang tercatat.</div>';
                } else {
                    // Ekstrak Top 3 (Atau berikan nilai default jika kurang dari 3)
                    const p1 = data[0] || { name: '-', school: '-', score: 0 };
                    const p2 = data[1] || { name: '-', school: '-', score: 0 };
                    const p3 = data[2] || { name: '-', school: '-', score: 0 };

                    // 1. Buat HTML Podium
                    let html = `
                    <div class="podium-container">
                        <!-- Juara 2 -->
                        <div class="podium place-2">
                            <div class="avatar">🥈</div>
                            <div class="score">${p2.score > 0 ? p2.score : '-'}</div>
                            <div class="name">${p2.name}</div>
                            <div class="school">${p2.school}</div>
                            <div class="step step-2">2</div>
                        </div>
                        <!-- Juara 1 -->
                        <div class="podium place-1">
                            <div class="avatar" style="font-size: 45px; margin-bottom: -10px;">🥇</div>
                            <div class="score">${p1.score > 0 ? p1.score : '-'}</div>
                            <div class="name">${p1.name}</div>
                            <div class="school">${p1.school}</div>
                            <div class="step step-1">1</div>
                        </div>
                        <!-- Juara 3 -->
                        <div class="podium place-3">
                            <div class="avatar">🥉</div>
                            <div class="score">${p3.score > 0 ? p3.score : '-'}</div>
                            <div class="name">${p3.name}</div>
                            <div class="school">${p3.school}</div>
                            <div class="step step-3">3</div>
                        </div>
                    </div>
                    `;

                    // 2. Buat HTML Daftar Sisanya (Rank 4 ke atas)
                    if (data.length > 3) {
                        html += `<div class="space-y-2 mt-4">`;
                        for (let i = 3; i < data.length; i++) {
                            const entry = data[i];
                            html += `
                                <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-700 flex justify-between items-center hover:bg-gray-700 transition">
                                    <div class="flex items-center gap-3 w-2/3">
                                        <span class="text-blue-200 w-6 text-center font-bold">#${i + 1}</span>
                                        <div class="overflow-hidden">
                                            <div class="text-white font-bold text-sm truncate">${entry.name}</div>
                                            <div class="text-xs text-gray-400 truncate">${entry.school}</div>
                                        </div>
                                    </div>
                                    <div class="text-yellow-400 font-mono font-bold">${entry.score}</div>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    }
                    
                    lbContent.innerHTML = html;
                }
            } catch (error) {
                lbContent.innerHTML = '<div class="text-center text-red-400 py-4">Gagal memuat papan skor.</div>';
            } finally {
                lbLoading.style.display = 'none';
                lbContent.classList.remove('hidden');
            }
        }

        function showLeaderboard() {
            switchScreen('leaderboard');
            fetchLeaderboard();
        }

        function saveScore(name, school, score) {
            if (!name || name === 'Anonim') return;
            try {
                fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, school: school, score: score })
                });
            } catch (error) {
                console.error("Gagal menyimpan skor:", error);
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-14 left-1/2 transform -translate-x-1/2 bg-red-600/95 text-white px-6 py-2 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.5)] z-[200] font-bold text-sm backdrop-blur-md transition-opacity duration-500';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(),500); }, 2000);
        }

        function toggleFullscreen() {
            const doc = document.documentElement;
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFull) {
                if (doc.requestFullscreen) doc.requestFullscreen().catch(e=>console.log(e));
                else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        document.addEventListener('fullscreenchange', onFSChange);
        document.addEventListener('webkitfullscreenchange', onFSChange);
        function onFSChange() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            document.getElementById('icon-fs-enter').classList.toggle('hidden', isFull);
            document.getElementById('icon-fs-exit').classList.toggle('hidden', !isFull);
            setTimeout(() => { instances.forEach(i => i.calculateAndResize()); }, 200);
        }

        // --- GAME INSTANCE CLASS ---
        class GameInstance {
            constructor(id, name, school) {
                this.id = id;
                this.name = name;
                this.school = school;
                this.placedCount = 0;
                this.mistakeCount = 0;
                this.startTime = Date.now();
                this.isFinished = false;
                this.orbitRadii = [];
                this.createDOM();
            }

            createDOM() {
                this.container = document.createElement('div');
                this.container.className = 'game-instance';
                this.container.id = `instance-${this.id}`;

                this.container.innerHTML = `
                    <div class="instance-ui">
                        <div class="player-badge border-${this.id===1?'blue':'purple'}-500/50">
                            <div class="dot" style="background:${this.id===1?'#3b82f6':'#a855f7'}; box-shadow: 0 0 8px ${this.id===1?'#3b82f6':'#a855f7'};"></div>
                            ${this.name}
                        </div>
                        <div class="progress-container mt-1">
                            <div class="progress-bg"><div class="progress-bar" style="background: ${this.id===1?'linear-gradient(90deg, #3b82f6, #60a5fa)':'linear-gradient(90deg, #a855f7, #c084fc)'}"></div></div>
                            <div class="text-[10px] text-white/70 font-semibold mt-0.5 progress-text">0% Selesai</div>
                        </div>
                    </div>
                    <div class="orbit-zone"><div class="sun"></div></div>
                    <div class="planet-sidebar"></div>
                `;

                this.orbitZone = this.container.querySelector('.orbit-zone');
                this.sidebar = this.container.querySelector('.planet-sidebar');
                this.progressBar = this.container.querySelector('.progress-bar');
                this.progressText = this.container.querySelector('.progress-text');
            }

            calculateAndResize() {
                const rect = this.orbitZone.getBoundingClientRect();
                const minDim = Math.min(rect.width, rect.height);
                const sunSize = this.orbitZone.querySelector('.sun').offsetWidth || 60;
                const startRadius = (sunSize / 2) + 15;
                const step = ((minDim / 2) - 10 - startRadius) / TOTAL_PLANETS;
                
                this.orbitRadii = planetData.map((_, i) => startRadius + (step * (i + 1)));
                
                // Resize existing rings
                let rings = this.orbitZone.querySelectorAll('.orbit-ring');
                if (rings.length === 0) {
                    this.orbitRadii.forEach((rad, i) => {
                        let ring = document.createElement('div');
                        ring.className = 'orbit-ring';
                        ring.dataset.orbitIndex = i;
                        this.orbitZone.appendChild(ring);
                        rings = this.orbitZone.querySelectorAll('.orbit-ring'); // update list
                    });
                }
                
                rings.forEach((ring, i) => {
                    ring.style.width = (this.orbitRadii[i] * 2) + 'px';
                    ring.style.height = (this.orbitRadii[i] * 2) + 'px';
                });

                // Resize orbiting planets
                this.orbitZone.querySelectorAll('.orbiting-wrapper').forEach(wrap => {
                    const idx = planetData.find(p => p.id === wrap.dataset.planetId).orbitIndex;
                    wrap.style.setProperty('--orbit-radius', this.orbitRadii[idx] + 'px');
                });
            }

            spawnPlanets() {
                this.sidebar.innerHTML = '';
                const scaleFactor = currentMode === 'duel' ? 0.65 : 1; // Responsif planet mode duel
                const shuffled = [...planetData].sort(() => Math.random() - 0.5);
                shuffled.forEach(data => {
                    const actualSize = data.size * scaleFactor;
                    const p = document.createElement('div');
                    p.className = 'planet';
                    p.style.width = actualSize + 'px';
                    p.style.height = actualSize + 'px';
                    p.style.background = this.getPlanetStyle(data.type);
                    p.dataset.id = data.id;
                    p.dataset.instanceId = this.id;
                    if (data.isRinged) p.classList.add('ringed');

                    const label = document.createElement('span');
                    label.className = 'planet-label'; label.innerText = data.name;
                    p.appendChild(label);

                    p.addEventListener('mousedown', handleDragStart);
                    p.addEventListener('touchstart', handleDragStart, {passive: false});

                    this.sidebar.appendChild(p);
                });
            }

            getPlanetStyle(type) {
                switch(type) {
                    case 'mercury': return `radial-gradient(circle at 30% 30%, #e0e0e0 0%, #9e9e9e 60%, #424242 100%)`;
                    case 'venus': return `linear-gradient(45deg, #e6b800, #ffcc33, #e6b800)`;
                    case 'earth': return `radial-gradient(circle at 30% 30%, #4ade80 20%, #3b82f6 80%)`;
                    case 'mars': return `linear-gradient(135deg, #cd5c5c, #8b0000)`;
                    case 'jupiter': return `linear-gradient(180deg, #d1bd9f 20%, #a89078 30%, #7d6b58 60%, #5c4a3d 100%)`;
                    case 'saturn': return `linear-gradient(180deg, #e2d3bc 15%, #cbbba0 35%, #a6957b 100%)`;
                    case 'uranus': return `radial-gradient(circle at 30% 30%, #e0ffff 0%, #00ced1 100%)`;
                    case 'neptune': return `radial-gradient(circle at 40% 40%, #4169e1, #00008b)`;
                    default: return 'gray';
                }
            }

            snapPlanet(element, pData) {
                element.classList.add('placed', 'slot-correct');
                element.style.margin = '0';
                
                const scaleFactor = currentMode === 'duel' ? 0.65 : 1;
                const actualSize = pData.size * scaleFactor;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'orbiting-wrapper';
                wrapper.style.animationDuration = pData.orbitTime + 's';
                wrapper.style.setProperty('--orbit-radius', this.orbitRadii[pData.orbitIndex] + 'px');
                wrapper.dataset.planetId = pData.id;
                element.style.position = 'absolute';
                element.style.left = '-'+ (actualSize/2) +'px';
                element.style.top = '-'+ (actualSize/2) +'px';
                element.style.transform = '';
                
                wrapper.appendChild(element);
                this.orbitZone.appendChild(wrapper);

                this.placedCount++;
                const pct = (this.placedCount / TOTAL_PLANETS) * 100;
                this.progressBar.style.width = pct + '%';
                this.progressText.innerText = Math.round(pct) + '% Selesai';

                if (this.placedCount === TOTAL_PLANETS) {
                    this.isFinished = true;
                    checkGameEnd(this);
                }
            }

            returnPlanet(element) {
                element.style.transition = 'all 0.4s ease';
                element.style.opacity = '0'; 
                this.mistakeCount++;
                setTimeout(() => {
                    element.remove();
                    this.spawnSinglePlanet(element.dataset.id);
                }, 400);
            }

            spawnSinglePlanet(id) {
                const pData = planetData.find(p => p.id === id);
                if(!pData) return;
                
                const scaleFactor = currentMode === 'duel' ? 0.65 : 1;
                const actualSize = pData.size * scaleFactor;

                const p = document.createElement('div');
                p.className = 'planet';
                p.style.width = actualSize + 'px'; p.style.height = actualSize + 'px';
                p.style.background = this.getPlanetStyle(pData.type);
                p.dataset.id = pData.id; p.dataset.instanceId = this.id;
                if (pData.isRinged) p.classList.add('ringed');
                p.innerHTML = `<span class="planet-label">${pData.name}</span>`;
                p.addEventListener('mousedown', handleDragStart);
                p.addEventListener('touchstart', handleDragStart, {passive: false});
                this.sidebar.appendChild(p);
            }
        }

        // --- DRAG AND DROP LOGIC ---
        function handleDragStart(e) {
            if (e.target.closest('.orbiting-wrapper')) return;
            e.preventDefault(); initAudio(); playSound('grab');
            
            const touch = e.touches ? e.touches[0] : e;
            const element = e.target.closest('.planet');
            if (!element) return;

            activeDrag.element = element;
            activeDrag.sourceInstanceId = parseInt(element.dataset.instanceId);
            
            const rect = element.getBoundingClientRect();
            activeDrag.offsetX = touch.clientX - rect.left;
            activeDrag.offsetY = touch.clientY - rect.top;

            element.style.position = 'fixed';
            element.style.left = rect.left + 'px';
            element.style.top = rect.top + 'px';
            element.style.zIndex = 1000;
            element.style.margin = '0'; 
            document.body.appendChild(element);

            if (e.touches) {
                document.addEventListener('touchmove', handleDragMove, {passive: false});
                document.addEventListener('touchend', handleDragEnd);
            } else {
                document.addEventListener('mousemove', handleDragMove);
                document.addEventListener('mouseup', handleDragEnd);
            }
        }

        function handleDragMove(e) {
            if (!activeDrag.element) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            activeDrag.element.style.left = (touch.clientX - activeDrag.offsetX) + 'px';
            activeDrag.element.style.top = (touch.clientY - activeDrag.offsetY) + 'px';
            
            const instance = instances.find(inst => inst.id === activeDrag.sourceInstanceId);
            if (!instance) return;

            const zoneRect = instance.orbitZone.getBoundingClientRect();
            const cx = zoneRect.left + zoneRect.width/2;
            const cy = zoneRect.top + zoneRect.height/2;
            const dist = Math.sqrt(Math.pow(touch.clientX - cx, 2) + Math.pow(touch.clientY - cy, 2));
            
            let closestIndex = -1;
            let minDist = Infinity;
            instance.orbitRadii.forEach((r, i) => {
                 const d = Math.abs(dist - r);
                 if (d < minDist) { minDist = d; closestIndex = i; }
            });
            
            instance.orbitZone.querySelectorAll('.orbit-ring').forEach(r => r.classList.remove('highlight'));
            if (minDist < 25) { // Hanya menyorot jika benar-benar dekat
                 const rings = instance.orbitZone.querySelectorAll('.orbit-ring');
                 if(rings[closestIndex]) rings[closestIndex].classList.add('highlight');
            }
        }

        function handleDragEnd(e) {
            if (!activeDrag.element) return;
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);

            const element = activeDrag.element;
            const instance = instances.find(inst => inst.id === activeDrag.sourceInstanceId);
            instance.orbitZone.querySelectorAll('.orbit-ring').forEach(r => r.classList.remove('highlight'));

            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const zoneRect = instance.orbitZone.getBoundingClientRect();
            const dist = Math.sqrt(Math.pow(centerX - (zoneRect.left + zoneRect.width/2), 2) + Math.pow(centerY - (zoneRect.top + zoneRect.height/2), 2));

            let closestIndex = -1;
            let minDist = Infinity;
            instance.orbitRadii.forEach((r, i) => {
                 const d = Math.abs(dist - r);
                 if (d < minDist) { minDist = d; closestIndex = i; }
            });

            const pData = planetData.find(p => p.id === element.dataset.id);
            
            // Logika edukasi: Deteksi jarak sangat presisi (< 25px)
            if (minDist < 25) {
                if (closestIndex === pData.orbitIndex) {
                    playSound('success');
                    instance.snapPlanet(element, pData);
                } else {
                    playSound('error');
                    instance.returnPlanet(element);
                    const correctPlanet = planetData.find(p => p.orbitIndex === closestIndex);
                    showToast(`Salah! Itu adalah garis orbit milik ${correctPlanet.name}.`);
                }
            } else {
                playSound('error');
                instance.returnPlanet(element);
                showToast("Letakkan planet tepat di garis orbitnya!");
            }
            activeDrag.element = null;
        }

        // --- GAME FLOW CONTROLS ---
        function startGameSession() {
            const p1Name = document.getElementById('p1-name');
            const p1School = document.getElementById('p1-school');
            const p2Name = document.getElementById('p2-name');
            const p2School = document.getElementById('p2-school');

            // Validasi P1
            if (!p1Name.value.trim() || !p1School.value.trim()) {
                if(!p1Name.value.trim()) p1Name.classList.add('input-error');
                if(!p1School.value.trim()) p1School.classList.add('input-error');
                setTimeout(() => { p1Name.classList.remove('input-error'); p1School.classList.remove('input-error'); }, 500);
                initAudio(); playSound('error'); return;
            }

            // Validasi P2 (Jika Duel)
            if (currentMode === 'duel') {
                if (!p2Name.value.trim() || !p2School.value.trim()) {
                    if(!p2Name.value.trim()) p2Name.classList.add('input-error');
                    if(!p2School.value.trim()) p2School.classList.add('input-error');
                    setTimeout(() => { p2Name.classList.remove('input-error'); p2School.classList.remove('input-error'); }, 500);
                    initAudio(); playSound('error'); return;
                }
            }

            initAudio(); playSound('success');
            
            // Siapkan Wrapper
            const wrapper = document.getElementById('game-wrapper');
            wrapper.innerHTML = '';
            wrapper.className = currentMode === 'duel' ? 'duel-mode' : '';
            instances = [];

            // Buat Instances
            instances.push(new GameInstance(1, p1Name.value.trim(), p1School.value.trim()));
            if (currentMode === 'duel') {
                instances.push(new GameInstance(2, p2Name.value.trim(), p2School.value.trim()));
            }

            instances.forEach(inst => {
                wrapper.appendChild(inst.container);
            });

            switchScreen('game');
            isGameActive = true;

            // Pastikan layout siap sebelum kalkulasi
            setTimeout(() => {
                instances.forEach(inst => {
                    inst.calculateAndResize();
                    inst.spawnPlanets();
                });
            }, 100);
        }

        function checkGameEnd(finishedInstance) {
            if (currentMode === 'solo') {
                endGameProcess([finishedInstance]);
            } else if (currentMode === 'duel') {
                // Di Mode Duel, siapa cepat dia menang! Hentikan game
                endGameProcess([finishedInstance]); // Kirim yg menang saja
            }
        }

        function endGameProcess(winners) {
            isGameActive = false;
            playSound('win');
            
            const modal = document.getElementById('feedback-modal');
            const title = document.getElementById('modal-title');
            const subtitle = document.getElementById('modal-subtitle');
            const scoreDiv = document.getElementById('modal-scores');
            
            scoreDiv.innerHTML = '';

            if (currentMode === 'solo') {
                title.innerText = "Luar Biasa! 🎉";
                subtitle.innerText = "Tata Surya telah tersusun.";
                const inst = winners[0];
                const timeTaken = Math.floor((Date.now() - inst.startTime) / 1000);
                let score = Math.max(0, 1000 - (timeTaken * 2) - (inst.mistakeCount * 50));
                scoreDiv.innerHTML = `<p class="text-2xl font-bold text-yellow-400 font-mono">Skor: ${score}</p><p class="text-sm text-gray-400">Waktu: ${timeTaken} detik</p>`;
                
                // Simpan ke Database
                saveScore(inst.name, inst.school, score);
            } else {
                title.innerText = `🏆 ${winners[0].name} Menang!`;
                subtitle.innerText = "Telah menyusun tata surya lebih dulu.";
                // Hitung skor untuk keduanya
                instances.forEach(inst => {
                    const timeTaken = Math.floor((Date.now() - inst.startTime) / 1000);
                    // Pemenang dapat bonus, yg kalah dikurangi sisa yg belum selesai
                    let baseScore = inst.isFinished ? 1000 : (inst.placedCount * 100);
                    let score = Math.max(0, baseScore - (timeTaken * 2) - (inst.mistakeCount * 50));
                    scoreDiv.innerHTML += `<div class="bg-gray-800 p-2 rounded mb-2 border border-${inst.id===1?'blue':'purple'}-500/50"><p class="font-bold text-${inst.id===1?'blue':'purple'}-300">${inst.name}</p><p class="font-mono text-yellow-400">Skor: ${score}</p></div>`;
                    
                    // Simpan ke Database
                    saveScore(inst.name, inst.school, score);
                });
            }

            modal.style.display = 'block';
        }

        function resetCurrentGame() {
            if (!isGameActive && document.getElementById('feedback-modal').style.display !== 'block') return;
            startGameSession(); // Mengulang instance yang sama
        }

        function goToHome(confirmCheck = false) {
            if (confirmCheck && isGameActive) {
                if (!confirm("Misi sedang berjalan. Yakin ingin kembali ke menu?")) return;
            }
            isGameActive = false;
            switchScreen('home');
        }

        // Bintang Background
        function createStars() {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            for(let i=0; i<80; i++) {
                const star = document.createElement('div'); star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
                star.style.width = size + 'px'; star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random()*3+2)+'s');
                container.appendChild(star);
            }
        }

        // Listener Window Resize untuk Redraw Orbit
        window.addEventListener('resize', () => {
            if (isGameActive) {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(() => {
                    instances.forEach(inst => inst.calculateAndResize());
                }, 200);
            }
        });

        // Splash
        window.addEventListener('load', () => {
            createStars();
            setTimeout(() => {
                document.getElementById('splash-screen').classList.remove('active');
                setTimeout(() => { document.getElementById('home-screen').classList.add('active'); }, 400); 
            }, 2500);
        });

    </script>
</body>
